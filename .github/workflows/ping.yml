name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"  # Every 10 minutes
  workflow_dispatch:        # Allow manual trigger if you want

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping UASE Tech Studio
        run: |
          echo "🔄 Pinging your Render site to keep it awake..."
          curl -I https://uase.tech
