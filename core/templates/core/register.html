{% extends 'core/layout.html' %}
{% load static %}

{% block title %}Join the Studio | UASE Tech Studio{% endblock %}

{% block content %}
<style>
    /* 1. LAYOUT & BACKGROUND */
    .auth-page {
        background: url("{% static 'core/images/about_journey.jpg' %}") no-repeat center center fixed;
        background-size: cover;
        min-height: 90vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: -3rem;
    }

    /* 2. GLASSMORPHISM CARD (Wider for Registration) */
    .auth-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 30px;
        padding: 3rem;
        max-width: 500px; /* Slightly wider for registration forms */
        width: 100%;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        transition: all 0.4s ease;
    }

    .auth-card:hover {
        border-color: var(--accent);
    }

    /* 3. FORM ELEMENTS */
    .auth-card h2 {
        font-weight: 800;
        letter-spacing: -1px;
        color: white;
        margin-bottom: 1.5rem;
    }

    .auth-card p { margin-bottom: 1.2rem; }

    .auth-card p label {
        display: block;
        color: rgba(255, 255, 255, 0.9);
        margin-bottom: 6px;
        font-size: 0.9rem;
        font-weight: 500;
    }

    /* Handle Django's .helptext (Password requirements) */
    .helptext {
        display: block;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.5) !important;
        margin-top: 5px;
        line-height: 1.2;
    }

    .auth-card input {
        width: 100%;
        background: rgba(255, 255, 255, 0.07) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        border-radius: 12px !important;
        padding: 10px 15px !important;
        color: white !important;
        transition: all 0.3s ease;
    }

    .auth-card input:focus {
        background: rgba(255, 255, 255, 0.12) !important;
        border-color: var(--accent) !important;
        outline: none;
        box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
    }

    /* 4. BUTTON & LINKS */
    .btn-register {
        background: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%);
        border: none;
        border-radius: 12px;
        padding: 14px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: white;
        box-shadow: 0 10px 20px rgba(0, 114, 255, 0.3);
        transition: all 0.3s ease;
    }

    .btn-register:hover {
        transform: scale(1.02);
        box-shadow: 0 15px 30px rgba(0, 114, 255, 0.5);
    }

    .auth-link a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
    }

    /* 5. DARK MODE */
    body.dark-mode .auth-page { background: #050810 !important; }
    body.dark-mode .auth-card { background: rgba(0, 0, 0, 0.4); }

    /* Error Handling */
    .errorlist {
        color: #ff4d4d;
        list-style: none;
        padding: 0;
        font-size: 0.85rem;
        margin-bottom: 10px;
    }
</style>

<div class="auth-page px-3">
    <div class="auth-card animate__animated animate__fadeInUp">
        <div class="text-center mb-4">
            <h2 class="mb-1">Create <span style="color: var(--accent);">Account</span></h2>
            <p class="text-white-50 small">Join our community of innovators today.</p>
        </div>

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="django-form-wrapper">
                {{ form.as_p }}
            </div>
            
            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-register">
                    Create My Account <i class="bi bi-person-plus-fill ms-2"></i>
                </button>
            </div>
        </form>

        <div class="mt-4 text-center">
            <p class="text-white-50 small auth-link">
                Already a member? <a href="{% url 'login' %}">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
